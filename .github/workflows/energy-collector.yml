name: Energy collector

# Runs the home energy collector on a schedule so it works 24/7 without
# relying on any machine being on. GitHub's scheduler can run a little late
# under load, so this is a best-effort ~5 min cadence, matching the Growatt
# datalogger's own reporting interval — no faster, to stay well clear of
# Anker's rate limits.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: energy-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r energy/requirements.txt

      - name: Collect and post a reading
        env:
          ANKER_EMAIL: ${{ secrets.ANKER_EMAIL }}
          ANKER_PASSWORD: ${{ secrets.ANKER_PASSWORD }}
          GROWATT_USERNAME: ${{ secrets.GROWATT_USERNAME }}
          GROWATT_PASSWORD: ${{ secrets.GROWATT_PASSWORD }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
        run: python energy/collector.py --once
