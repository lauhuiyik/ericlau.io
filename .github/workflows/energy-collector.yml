name: Energy collector

# Runs the home energy collector so it works 24/7 without relying on any
# machine being on. Cadence is ~5 min, matching the Growatt datalogger's own
# reporting interval — no faster, to stay clear of Anker's rate limits.
#
# Intentionally dispatch-ONLY. The schedule lives in the companion Cloudflare
# Worker (cron-pinger/), which calls workflow_dispatch, for two reasons:
#   1. GitHub's own `schedule:` trigger proved unreliable here — it fired at
#      1-3 HOUR gaps rather than every 5 min, which is why the Worker exists.
#   2. More importantly, a second uncontrolled trigger meant "pause the
#      collector" didn't actually pause it: during a deliberate pause after an
#      Anker rate-limit lockout, GitHub's schedule kept firing anyway and kept
#      logging in. One controllable trigger means pausing the Worker is now a
#      real, complete stop.
on:
  workflow_dispatch: {}

concurrency:
  group: energy-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r energy/requirements.txt

      - name: Collect and post a reading
        env:
          ANKER_EMAIL: ${{ secrets.ANKER_EMAIL }}
          ANKER_PASSWORD: ${{ secrets.ANKER_PASSWORD }}
          GROWATT_USERNAME: ${{ secrets.GROWATT_USERNAME }}
          GROWATT_PASSWORD: ${{ secrets.GROWATT_PASSWORD }}
          # Official token API — no login, and unlike the ShinePhone
          # endpoint it is not blocked from CI's IP range.
          GROWATT_API_TOKEN: ${{ secrets.GROWATT_API_TOKEN }}
          # Stable id, passed in so the plant-list lookup can be skipped.
          # Growatt is fetched by the Cloudflare Worker (this runner's IP is
          # refused by Growatt) and merged server-side by /api/ingest.
          GROWATT_SKIP: "1"
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
        # 4 samples 60s apart inside one run => ~1-minute resolution on the
        # dashboard from a 5-minute CI cadence, all on one Anker session
        # (no extra logins). Anker's cloud values move at ~1-min granularity,
        # so this is genuinely finer data, not repeated identical samples.
        run: python energy/collector.py --once --samples 4 --gap 60
