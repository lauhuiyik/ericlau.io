name: Restore Japan26 overlay after deploy

# WHY THIS EXISTS (short-term band-aid — remove when the Japan 2026 page is retired):
#
# This public repo deploys to Cloudflare on every push to main. That rebuild
# does NOT include the private japan2026 files (they live in a separate private
# content repo and are overlaid into public/experiments/japan2026/ at deploy
# time), so each deploy 404s /experiments/japan2026.
#
# On push to main we wait for Cloudflare's deploy to settle, then fire a
# repository_dispatch at the content repo so its overlay workflow re-applies
# the files and redeploys last (winning over the plain site deploy).
#
# SETUP (one-time, in this repo's Settings):
#   - Variable  JAPAN_CONTENT_REPO           = owner/your-japan-content-repo
#   - Secret    CONTENT_REPO_DISPATCH_TOKEN  = a PAT with contents:write on that repo
#   - Variable  OVERLAY_DISPATCH_DELAY_SECONDS (optional, default 300)
# And in the content repo's overlay workflow, add this trigger:
#   on:
#     repository_dispatch:
#       types: [site-deployed]

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  restore-overlay:
    runs-on: ubuntu-latest
    # Skip cleanly (green, no wasted wait) until the content repo is configured.
    if: ${{ vars.JAPAN_CONTENT_REPO != '' }}
    steps:
      - name: Wait for Cloudflare deploy to settle
        run: sleep "${{ vars.OVERLAY_DISPATCH_DELAY_SECONDS || '300' }}"

      - name: Trigger content repo overlay redeploy
        env:
          TOKEN: ${{ secrets.CONTENT_REPO_DISPATCH_TOKEN }}
          TARGET: ${{ vars.JAPAN_CONTENT_REPO }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CONTENT_REPO_DISPATCH_TOKEN secret not set — skipping dispatch."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TARGET}/dispatches" \
            -d '{"event_type":"site-deployed"}'
          echo "Dispatched site-deployed to ${TARGET}."
