<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello, world — ericlau.io / experiments</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        background: #0a0a0a;
        color: #f5f5f4;
        font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
        min-height: 100vh;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header, footer {
        padding: 24px 32px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: #737373;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }
      footer { border-top: 1px solid #1f1f1f; }
      a { color: inherit; text-decoration: none; }
      a:hover { color: #f5f5f4; }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 24px 32px;
      }
      h1 {
        font-size: clamp(48px, 12vw, 160px);
        font-weight: 600;
        letter-spacing: -0.04em;
        line-height: 0.9;
        margin: 0;
      }
      p {
        max-width: 540px;
        margin: 24px 0 0;
        line-height: 1.6;
        color: #a3a3a3;
      }
      .pulse {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #f5f5f4;
        margin-right: 12px;
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.8); }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/experiments">← experiments</a>
    </header>
    <main>
      <h1>Hello, world.</h1>
      <p>
        <span class="pulse"></span>
        This is a raw HTML file living in <code>public/experiments/hello/</code>.
        Drop any self-contained HTML in there and it goes live at the matching URL.
        Perfect for one-off experiments, prototypes, or anything you want to share quickly.
      </p>
    </main>
    <footer>
      <a href="/">← ericlau.io</a>
    </footer>
  </body>
</html>
